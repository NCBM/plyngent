# Commit gateway via prek (https://prek.j178.dev/) — drop-in pre-commit compatible.
# Install: uv tool install prek  (or: pipx install prek)
# Wire git: prek install
# Manual:  prek run --all-files
#
# Pin additional_dependencies to the same versions as pdm.lock (dev group).
# Bump these when you pdm update ruff / basedpyright.

default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]
default_language_version = { python = "python3.14" }

# Match CI / local pdm env (see pdm.lock).
[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "ruff check"
language = "python"
types_or = ["python", "pyi"]
args = ["--fix"]
require_serial = true
additional_dependencies = ["ruff==0.17.4"]

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "ruff format --force-exclude"
language = "python"
types_or = ["python", "pyi"]
require_serial = true
additional_dependencies = ["ruff==0.17.4"]

[[repos.hooks]]
id = "basedpyright"
name = "basedpyright"
entry = "basedpyright"
language = "python"
pass_filenames = false
require_serial = true
additional_dependencies = ["basedpyright==1.40.2"]

# The message a commit is written with: a scope and a statement of one sentence, a blank line, and one paragraph of
# reason on one line, of at most five sentences, where a clause past fifteen words counts as one. AGENTS.md states the
# shape and tools/commit_message.py checks it on every message, since a shape no hook reads is the one that drifts.
[[repos.hooks]]
id = "commit-message"
name = "commit message"
entry = "python tools/commit_message.py"
language = "python"
stages = ["commit-msg"]
require_serial = true