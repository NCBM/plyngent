[project]
name = "plyngent"
version = "1.0.0a1"
description = "LLM chat and agent toolkit"
authors = [
    {name = "HivertMoZara",email = "worldmozara@163.com"},
]
dependencies = [
  "composat>=1.0.2",
  "click>=8.4.2",
  "rich>=13",
  "prompt_toolkit>=3.0",
  "msgspec>=0.21.1",
  "niquests>=3.20",
  "aiosqlite>=0.22.1",
  "platformdirs>=4.10.0",
  "tomlkit>=0.15.0",
  "send2trash>=2.1.0",
  "pywinpty>=2.0.0; sys_platform == \"win32\"",
]
requires-python = ">=3.14,<4"
readme = "README.md"
license = "MIT"

[project.optional-dependencies]
notify = ["desktop-notifier>=6.2.0"]

[project.scripts]
plyngent = "plyngent.__main__:main"
plyngent-admin = "plyngent.admin:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "ruff>=0.17.4",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.0",
]

[tool.basedpyright]
typeCheckingMode = "recommended"
strictGenericNarrowing = true
reportAny = "hint"
reportExplicitAny = "hint"
reportImplicitStringConcatenation = "hint"
reportImportCycles = "hint"

[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["src", "."]
reportPrivateUsage = "none"
reportUnreachable = "none"
reportUnusedCallResult = "none"
reportUnannotatedClassAttribute = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportMissingParameterType = "none"
reportUnusedParameter = "none"
reportMissingImports = "none"
reportMissingTypeStubs = "none"
reportArgumentType = "none"
reportAttributeAccessIssue = "none"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
# For more rules, see https://docs.astral.sh/ruff/rules/.
select = [
  "F",  # Pyflakes
  "W",  # pycodestyle warnings
  "E",  # pycodestyle errors
  "I",  # isort
  "C90",  # mccabe
  "N",  # pep8-naming
  "PL",  # pylint
  "UP",  # pyupgrade
  "YTT",  # flake8-2020
  "ANN",  # flake8-annotations
  "ASYNC",  # flake8-async
  "BLE",  # flake8-blind-except
  "FBT",  # flake8-boolean-trap
  "B",  # flake8-bugbear
  "A",  # flake8-builtins
  "COM",  # flake8-commas
  "C4",  # flake8-comprehensions
  "DTZ",  # flake8-datetimez
  "T10",  # flake8-debugger
  "ICN",  # flake8-import-conventions
  "PIE",  # flake8-pie
  "T20",  # flake8-print
  "PYI",  # flake8-pyi
  "Q",  # flake8-quotes
  "RSE",  # flake8-raise
  "RET",  # flake8-return
  "SIM",  # flake8-simplify
  "SLOT",  # flake8-slots
  "TID",  # flake8-tidy-imports
  "TC",  # flake8-type-checking
  "ARG",  # flake8-unused-arguments
  "PTH",  # flake8-use-pathlib
  "FAST",  # FastAPI
  "PERF",  # Perflint
  "PGH",  # pygrep-hooks
  "FURB",  # refurb
  "TRY",  # tryceratops
  "RUF",  # Ruff-specific rules
]
ignore = [
  "UP037",  # quoted-annotation
  "ANN202",  # missing-return-type-private-function
  "ANN401",  # any-type
  "COM812",  # missing-trailing-comma
  "PLC0415",  # import-outside-top-level
  "TID252",
  "PLR0912",  # too-many-branches
  "PLR0913",  # too-many-arguments
  "PLR0917",  # too-many-positional-arguments
]
allowed-confusables = [
  "，",
  "。",
  "．",
  "“",
  "”",
  "’",
  "：",
  "；",
  "？",
  "！",
  "【",
  "】",
  "《",
  "》",
  "…",
  "—",
  "（",
  "）",
  "、"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "ANN",
  "ARG",
  "ASYNC240",
  "PLR2004",
  "PLR0911",
  "PLR0912",
  "PLR0915",
  "C901",
  "S101",
  "TC",
  "TRY003",
  "FBT",
]
